[project]
name = "dz-catalog-analysis-ulyanov-m26-555"
version = "0.1.0"
description = "Catalog analysis project"
readme = "README.md"
authors = [
    { name = "Nikolai Ulyanov", email = "kolyas18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt (>=0.4.1,<0.5.0)",
    "prettytable (>=3.18.0,<4.0.0)"
]

[project.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "primitive_db"

[tool.poetry]
packages = [
    { include = "primitive_db", from = "src" }
]

[dependency-groups]
dev = [
    "ruff>=0.16.8"
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []