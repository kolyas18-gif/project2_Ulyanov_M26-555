[project]
name = "dz-catalog-analysis-ulyanov-m26-555"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikolai Ulianov", email = "kolyas18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["prompt (>=0.4.1,<0.5.0)"]

[project.scripts]
dz-catalog-analysis-ulyanov-m26-555 = "dz_catalog_analysis_ulyanov_m26_555:main"
project = "src.primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
[tool.poetry.scripts]
project = "src.primitive_db.main:main"